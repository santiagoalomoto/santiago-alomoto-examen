name: CI/CD to VPS with Docker Swarm

on:
  push:
    branches:
      - carriel

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish-deploy:
    runs-on: ubuntu-latest

    env:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
      VPS_SSH_PORT: 1001
      IMAGE: ghcr.io/santiagoalomoto/alomoto-carriel-examen
      PACKAGE_NAME: alomoto-carriel-examen
      REPO_NAME: santiagoalomoto/santiago-alomoto-examen

    steps:
      # 1️⃣ Checkout del código
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3️⃣ Instalar dependencias
      - name: Install dependencies
        run: npm install

      # 4️⃣ Ejecutar tests
      - name: Run tests
        run: npm test

      # 5️⃣ Build de la app (si aplica)
      - name: Build app
        run: npm run build --if-present

      # 6️⃣ Login en GitHub Container Registry
      - name: Login to GHCR
        run: echo "${{ env.GHCR_PAT }}" | docker login ghcr.io -u santiagoalomoto --password-stdin

      # 7️⃣ Construir imagen Docker
      - name: Docker Build
        run: |
          docker build -t alomoto-carriel-examen:1.0.5 .

      # 8️⃣ Tag y Push al GHCR
      - name: Tag & Push Image to GHCR
        run: |
          docker tag alomoto-carriel-examen:1.0.5 $IMAGE:1.0.5
          docker tag alomoto-carriel-examen:1.0.5 $IMAGE:latest

          docker push $IMAGE:1.0.5
          docker push $IMAGE:latest

      # 8.1️⃣ Hacer el paquete público y vincularlo al repositorio
      - name: Make Package Public and Link to Repository
        run: |
          echo "🔧 Configurando visibilidad del paquete..."

          # Hacer el paquete público
          curl -s -X PATCH \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          https://api.github.com/user/packages/container/${PACKAGE_NAME} \
          -d '{"visibility":"public"}' || echo "⚠️ Puede que ya sea público"

          # Vincular paquete al repositorio
          echo "🔗 Vinculando paquete al repositorio..."
          curl -s -X PUT \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          https://api.github.com/user/packages/container/${PACKAGE_NAME}/versions/latest \
          -d "{\"repository\":\"${REPO_NAME}\"}" || echo "⚠️ Ya puede estar vinculado"

          echo "✅ Configuración completada"
          echo "📦 GHCR: https://github.com/${REPO_NAME}/pkgs/container/${PACKAGE_NAME}"

      # 9️⃣ Copiar stack.yml al VPS
      - name: Copiar stack.yml al VPS (SCP)
        uses: appleboy/scp-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          password: ${{ env.VPS_PASSWORD }}
          port: 1001
          source: "stack.yml"
          target: "/home/${{ env.VPS_USER }}/deploy"

      # 9.1️⃣ Verificar copia de stack.yml en VPS
      - name: Verificar copia de stack.yml en VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          password: ${{ env.VPS_PASSWORD }}
          port: 1001
          script: |
            if [ -f ~/deploy/stack.yml ]; then
              echo "✅ stack.yml copiado correctamente"
            else
              echo "❌ Error: stack.yml no encontrado"
              exit 1
            fi

      # 🔟 Deploy en el VPS via SSH
      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          password: ${{ env.VPS_PASSWORD }}
          port: 1001
          script: |
            echo "🚀 Desplegando nueva versión..."

            cd ~/deploy

            # Login GHCR desde el VPS
            echo "${{ env.GHCR_PAT }}" | docker login ghcr.io -u santiagoalomoto --password-stdin

            # Pull nueva imagen
            docker pull ghcr.io/santiagoalomoto/alomoto-carriel-examen:latest

            # Eliminar stack anterior
            docker stack rm carriel || true
            sleep 10

            # Desplegar stack limpio
            docker stack deploy --with-registry-auth -c stack.yml carriel

            docker service ls
            docker stack ps carriel
